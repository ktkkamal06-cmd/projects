<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Logistics Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 40px; color: #333; }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1a73e8; color: white; text-transform: uppercase; letter-spacing: 0.05em; font-size: 14px; }
        tr:hover { background-color: #f1f3f4; }
    </style>
</head>
<body>
    <h1>Event Analytics Dashboard</h1>
    <table>
        <thead>
            <tr>
                <th>Event ID</th>
                <th>Event Name</th>
                <th>Event Date</th>
            </tr>
        </thead>
        <tbody id="event-table-body">
            <!-- The C++ Backend data will be injected here automatically! -->
        </tbody>
    </table>

    <script>
        // 1. Silently reach out to the C++ server
        fetch('/api/events')
            .then(response => response.json()) // 2. Convert the response to JSON
            .then(data => {
                const tableBody = document.getElementById('event-table-body');
                
                // 3. Loop through the database results and build the HTML table rows!
                data.forEach(event => {
                    const row = `<tr>
                        <td>${event.id}</td>
                        <td><strong>${event.name}</strong></td>
                        <td>${event.date}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error fetching from C++ API:', error));
    </script>
</body>
</html>
